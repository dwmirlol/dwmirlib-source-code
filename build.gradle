plugins { id 'fabric-loom' version '1.14.10' }
version = '1.0.0'
group = 'dev.dwmir'
base { archivesName = 'dwmirlib' }
repositories { maven { url 'https://maven.terraformersmc.com/releases/' } }
dependencies {
 minecraft 'com.mojang:minecraft:1.21.11'
 mappings 'net.fabricmc:yarn:1.21.11+build.6:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.18.4'
 modCompileOnly 'com.terraformersmc:modmenu:17.0.1'
 modLocalRuntime 'com.terraformersmc:modmenu:17.0.1'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) }; withSourcesJar() }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }

if (project.hasProperty('clientTest')) {
 dependencies { modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11' }
 sourceSets { clientTest {
  java.srcDir 'clienttest/java'
  resources.srcDir 'clienttest/resources'
  compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
  runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
 } }
 configurations {
  clientTestImplementation.extendsFrom implementation
  clientTestRuntimeOnly.extendsFrom runtimeOnly
 }
 loom {
  mods {
   dwmirlib { sourceSet sourceSets.main }
   dwmirlib_test { sourceSet sourceSets.clientTest }
  }
  runs { clientTest {
   client()
   source sourceSets.clientTest
   runDir 'run-test'
   programArgs '--width', '1440', '--height', '900'
   vmArg '-Dfabric.client.gametest'
   vmArg '-Dfabric.client.gametest.modid=dwmirlib_test'
  } }
 }
}

if (project.hasProperty('integrationSuite')) {
 repositories { maven { url 'https://maven.shedaniel.me/' } }
 dependencies {
  modImplementation files('suite-libs/crossbow.jar','suite-libs/shield.jar')
  modImplementation('me.shedaniel.cloth:cloth-config-fabric:21.11.153') { exclude(group: 'net.fabricmc.fabric-api') }
 }
}

if (project.hasProperty('inventorySuite')) {
 repositories { maven { url 'https://maven.isxander.dev/releases' } }
 dependencies {
  modImplementation files('suite-libs/inventory.jar')
  modImplementation 'net.fabricmc:fabric-loader:0.19.5'
  modImplementation 'dev.isxander:yet-another-config-lib:3.8.2+1.21.11-fabric'
 }
}

loom { mixin { useLegacyMixinAp = true; defaultRefmapName = "dwmirlib.refmap.json" } }

if (project.hasProperty("sprinterSuite")) { dependencies { modImplementation files("suite-libs/sprinter.jar") } }

if(project.hasProperty("countitSuite")){dependencies{modImplementation files("suite-libs/countit.jar")}}

if(project.hasProperty("r10Suite")){dependencies{modImplementation files("suite-libs/glowing.jar","suite-libs/highlighter.jar")}}
